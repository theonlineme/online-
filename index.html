/* Layout: one phone-width column. Sticky top bar, a hanging red to-let tag as the logo,
   building elevations drawn in SVG as listing photos, four-tab bar at the bottom. */
:root{
  --bg:#EDF3EF; --surface:#FFFFFF; --surface-2:#F4F8F6; --fg:#13241D; --muted:#566A61;
  --line:#D3DFD8; --brand:#0A6B4D; --brand-ink:#FFFFFF; --brand-soft:#DCEEE6;
  --sign:#D52B33; --sign-ink:#FFFFFF; --sky:#D9EBE3; --lit:#F4C150; --glass:#6E8F86;
  --shadow:0 1px 2px rgba(16,40,31,.08),0 8px 20px rgba(16,40,31,.06);
  --f-display:"Tiro Bangla","Noto Serif Bengali",Georgia,serif;
  --f-body:"Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1512; --surface:#14211C; --surface-2:#1A2923; --fg:#E7F1EC; --muted:#95AAA0;
    --line:#283A33; --brand:#47C595; --brand-ink:#04241A; --brand-soft:#173429;
    --sign:#FF6A70; --sign-ink:#2B0507; --sky:#17302A; --lit:#F4C150; --glass:#3F5F57;
    --shadow:0 1px 2px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1512; --surface:#14211C; --surface-2:#1A2923; --fg:#E7F1EC; --muted:#95AAA0;
  --line:#283A33; --brand:#47C595; --brand-ink:#04241A; --brand-soft:#173429;
  --sign:#FF6A70; --sign-ink:#2B0507; --sky:#17302A; --lit:#F4C150; --glass:#3F5F57;
  --shadow:0 1px 2px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.65 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
[hidden]{display:none!important}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.shell{max-width:520px;margin-inline:auto}
main{padding-bottom:104px;min-height:70vh}
body[data-v="detail"] .shell>header.top{display:none}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 8px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo svg{width:30px;height:38px;flex:none}
.logo b{font:400 21px/1.15 var(--f-display);display:block;white-space:nowrap}
.logo small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--fg)}

/* home */
.lead{padding-block:8px 14px}
.lead h1{font:400 26px/1.3 var(--f-display);text-wrap:balance}
.lead p{color:var(--muted);margin-top:4px;font-size:15px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;min-height:50px;box-shadow:var(--shadow)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;padding:12px 0}
.search:focus-within{border-color:var(--brand)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;min-height:38px;cursor:pointer;font-size:15px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.bar{display:flex;gap:8px;align-items:center;padding-block:8px}
.sel{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:42px}
.fbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;min-height:42px;cursor:pointer;position:relative;white-space:nowrap}
.fbtn i{font-style:normal;background:var(--sign);color:var(--sign-ink);border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;font-size:12px;padding:0 5px}
.note{font-size:13.5px;color:var(--muted);background:var(--brand-soft);border-radius:10px;padding:8px 12px;margin-block:4px 8px}
.count{color:var(--muted);font-size:14px;padding-block:6px 10px}
.list{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);min-width:0}
.thumb{position:relative;aspect-ratio:16/10;max-width:100%;background:var(--sky)}
.thumb .fac,.hero .fac{display:block;width:100%;height:100%}
.tlink{position:absolute;inset:0;z-index:1}
.price{position:absolute;left:10px;bottom:10px;z-index:2;background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:2px 10px;font-weight:700;font-size:17px;pointer-events:none}
.price small{font-weight:400;font-size:12px;margin-left:3px}
.vbadge,.ubadge{position:absolute;left:10px;top:10px;z-index:2;display:flex;align-items:center;gap:4px;background:var(--surface);color:var(--brand);border-radius:999px;padding:1px 10px 1px 7px;font-size:13px;font-weight:600;pointer-events:none}
.vbadge .ic{width:15px;height:15px}
.ubadge{color:var(--sign);padding-left:10px}
.heart{position:absolute;right:10px;top:10px;z-index:3;width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.heart.on{color:var(--sign)}
.heart.on .ic,.ic.on{fill:currentColor}
.cbody{padding:12px 14px 14px;display:grid;gap:4px}
.cbody h3{font:600 17px/1.4 var(--f-body)}
.loc{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:14.5px}
.loc .ic{width:16px;height:16px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;font-size:14.5px}
.meta li{display:flex;align-items:center;gap:5px}
.meta .ic{width:17px;height:17px;color:var(--muted)}
.when{font-size:13px;color:var(--muted);margin-top:2px}
.empty{text-align:center;padding:36px 12px;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty h2{font:400 21px/1.4 var(--f-display);color:var(--fg)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:10px;min-height:48px;padding:0 18px;font-weight:600;cursor:pointer;text-align:center}
.btn.alt{background:transparent;color:var(--brand)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn.danger{background:transparent;border-color:var(--sign);color:var(--sign)}
.btn.sm{min-height:40px;padding:0 12px;font-size:15px}
.btn.block{width:100%}

/* detail */
.back{display:flex;align-items:center;gap:8px}
.back span{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.hero{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:var(--sky);border:1px solid var(--line)}
.hero .tag{position:absolute;left:12px;top:12px}
.dhead{padding-block:14px 6px;display:grid;gap:6px}
.dhead h1{font:400 25px/1.35 var(--f-display);text-wrap:balance}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:1px 11px;font-size:13.5px;font-weight:600}
.pill.red{background:transparent;border:1px solid var(--sign);color:var(--sign)}
.sec{margin-top:18px;display:grid;gap:10px}
.sec h2{font:400 20px/1.4 var(--f-display)}
.rent{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.rent .big{font-size:30px;font-weight:700;line-height:1.2}
.rent .big small{font-size:14px;font-weight:400;color:var(--muted);margin-left:4px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-top:1px dashed var(--line);padding-top:8px}
.row span:first-child{color:var(--muted)}
.row b{font-variant-numeric:tabular-nums;text-align:right}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px;justify-items:start;min-width:0}
.fact .ic{color:var(--brand)}
.fact small{color:var(--muted);font-size:13px}
.fact b{font-size:15.5px;overflow-wrap:anywhere}
.am{display:flex;flex-wrap:wrap;gap:8px}
.am li{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:14.5px}
.am .ic{width:16px;height:16px;color:var(--brand)}
.tip{display:flex;gap:10px;background:var(--brand-soft);border-radius:12px;padding:12px 14px;font-size:14.5px}
.tip .ic{color:var(--brand);margin-top:3px}
.owner{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.owner .who{display:flex;gap:12px;align-items:center}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:400 20px var(--f-display);flex:none}
.num{font-size:19px;font-weight:600;letter-spacing:.02em;user-select:all;-webkit-user-select:all}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cta>div{max-width:520px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tabs>div{max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:grid;justify-items:center;gap:1px;padding:8px 2px 7px;font-size:12.5px;color:var(--muted);position:relative;min-height:56px}
.tab[aria-current="page"]{color:var(--brand);font-weight:600}
.tab .ic{width:23px;height:23px}
.tab.plus .ic{background:var(--sign);color:var(--sign-ink);border-radius:50%;padding:4px;width:30px;height:30px;stroke-width:2.2}
.tab.plus{color:var(--fg)}
.tab em{font-style:normal;position:absolute;top:4px;left:calc(50% + 6px);background:var(--sign);color:var(--sign-ink);border-radius:999px;min-width:18px;height:18px;font-size:11px;display:grid;place-items:center;padding:0 4px;font-weight:700}

/* forms */
.page-h{padding-block:6px 10px}
.page-h h1{font:400 26px/1.35 var(--f-display)}
.page-h p{color:var(--muted);font-size:15px}
form{display:grid;gap:16px}
.field{display:grid;gap:5px;min-width:0}
.field label,.field legend{font-weight:600;font-size:15px}
.field small{color:var(--muted);font-size:13.5px}
.in{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px}
textarea.in{min-height:96px;resize:vertical}
.in:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.in[aria-invalid="true"]{border-color:var(--sign)}
.err{color:var(--sign);font-size:13.5px;min-height:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
fieldset{border:0;padding:0;margin:0;min-width:0;display:grid;gap:8px}
.ck{display:flex;flex-wrap:wrap;gap:8px}
.ck label{font-weight:400}
.ck input{position:absolute;opacity:0;pointer-events:none}
.ck span{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;min-height:38px;cursor:pointer;font-size:15px}
.ck input:checked+span{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.ck input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:10px 4px;min-height:44px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);font-weight:600}
.myad{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.myad .acts{display:flex;flex-wrap:wrap;gap:8px}
.card.rented .fac{filter:grayscale(1);opacity:.6}
ul.tips{display:grid;gap:8px;padding-left:20px;list-style:disc;color:var(--muted);font-size:15px}

/* sheets and toast */
.sheet{position:fixed;inset:0;z-index:40}
.sheet-bg{position:absolute;inset:0;background:rgba(5,15,11,.55)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:auto;background:var(--surface);border-radius:18px 18px 0 0;max-height:88%;display:grid;grid-template-rows:auto 1fr auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px 18px}
.sheet-head h2{font:400 21px var(--f-display)}
.sheet-body{overflow-y:auto;padding:6px 18px 14px;display:grid;gap:18px;align-content:start}
.sheet-foot{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
.sheet h3{font-size:15px;font-weight:600;margin-bottom:8px}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding-block:0}
.radio{display:grid;gap:8px}
.radio label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;max-width:min(92vw,480px);background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 16px;font-size:15px;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
}
</style>

        if(l.t!=='office'&&r()<.5)g+='<rect x="'+(wx-3)+'" y="'+(y+wh)+'" width="28" height="3" fill="var(--glass)" opacity=".75"/>';
      }
    }
    g+='<rect x="'+(W/2-9)+'" y="'+(G-fh*.78)+'" width="18" height="'+(fh*.78)+'" fill="var(--glass)"/>';
    g+='<circle cx="'+(x0-16)+'" cy="'+(G-20)+'" r="14" fill="var(--brand)" opacity=".35"/><rect x="'+(x0-17)+'" y="'+(G-9)+'" width="2.5" height="9" fill="var(--glass)"/>';
  }
  var th=Math.min(14,fh*.75),ty=G-th-3,tx=W/2+20;
  g+='<rect x="'+tx+'" y="'+ty+'" width="32" height="'+th+'" rx="2" fill="var(--sign)"/><text x="'+(tx+16)+'" y="'+(ty+th*.72)+'" text-anchor="middle" font-size="'+(th*.58)+'" font-weight="700" fill="var(--sign-ink)" font-family="Hind Siliguri,Noto Sans Bengali,sans-serif">টু-লেট</text>';
  return g+'</svg>';
}

/* ---------- filtering ---------- */
function filtered(){
  var q=F.q.trim().toLowerCase();
  var res=all().filter(function(l){
    if(F.city&&l.c!==F.city)return false;
    if(F.type&&l.t!==F.type)return false;
    if(F.min&&l.r<F.min)return false;
    if(F.max&&l.r>F.max)return false;
    if(F.beds){if(F.beds>=4){if(l.bd<4)return false}else if(l.bd!==F.beds)return false}
    if(F.ver&&!l.v)return false;
    for(var i=0;i<F.am.length;i++){if(l.am.indexOf(F.am[i])<0)return false}
    if(q){var hay=(l.a+' '+l.c+' '+l.ti+' '+T[l.t]+' '+l.tn).toLowerCase();if(hay.indexOf(q)<0)return false}
    return true;
  });
  res.sort(function(a,b){
    if(F.sort==='low')return a.r-b.r;
    if(F.sort==='high')return b.r-a.r;
    return (a.u?-1:(a.d))-(b.u?-1:(b.d));
  });
  return res;
}
function activeCount(){return (F.min||F.max?1:0)+(F.beds?1:0)+(F.ver?1:0)+F.am.length}
function renderList(){
  var res=filtered(),box=$('#list');if(!box)return;

  var b=$('#fbadge');if(b){var n=activeCount();b.hidden=!n;b.textContent=bn(n)}
}

  function seg(v,t){return '<button data-a="theme-set" data-v="'+v+'" aria-pressed="'+(mode===v)+'">'+t+'</button>'}
  return '<div class="page-h"><h1>আমার</h1><p>লগইন আসল অ্যাপে আসবে। এখন সব তথ্য আপনার ফোনেই থাকে।</p></div>'+
    '<section class="sec" style="margin-top:6px"><h2>আমার বিজ্ঞাপন</h2>'+(mine||'<div class="empty" style="padding:18px 8px"><p>এখনো কোনো বিজ্ঞাপন দেননি।</p><a class="btn alt" href="#post">বিজ্ঞাপন দিন</a></div>')+'</section>'+
    '<section class="sec"><h2>দেখতে কেমন</h2><div class="seg" role="group" aria-label="থিম">'+seg('system','সিস্টেম')+seg('light','হালকা')+seg('dark','গাঢ়')+'</div></section>'+
    '<section class="sec"><h2>নিরাপদে বাসা ভাড়া নিতে</h2><ul class="tips"><li>নিজে গিয়ে বাসা দেখুন, তারপর অগ্রিম দিন।</li><li>অগ্রিম ও ভাড়ার লেনদেনের রসিদ বা চুক্তিপত্র রাখুন।</li><li>ভুয়া বা সন্দেহজনক বিজ্ঞাপন পেলে রিপোর্ট করুন।</li></ul></section>'+
    '<section class="sec"><h2>ডেমো ডাটা</h2><button class="btn danger block" data-a="reset-demo">'+(delArm==='reset'?'নিশ্চিত করুন, সব মুছে যাবে':'সংরক্ষিত ও আমার বিজ্ঞাপন মুছুন')+'</button><p style="color:var(--muted);font-size:13.5px;text-align:center">বাসা ভাড়া ডটকম · ডেমো সংস্করণ ১.০</p></section>';
}

/* ---------- router ---------- */
function setTab(name){
  $$('.tab').forEach(function(t){if(t.dataset.t===name)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current')});
  var fc=$('#favCount'),n=favs.size;fc.hidden=!n;fc.textContent=bn(n);
}
function route(){
  var h=location.hash.replace(/^#/,'')||'home',app=$('#app'),cta=$('#cta'),tabs=$('#tabs');
  if(document.body.dataset.v==='home')homeY=window.pageYOffset||0;
  var v='home',l=null;
  if(h.indexOf('listing-')===0){l=find(h.slice(8));v=l?'detail':'home'}
  else if(['saved','post','me'].indexOf(h)>=0)v=h;
  document.body.dataset.v=v;
  hideSheets();sheetPushed=false;
  cta.hidden=true;tabs.hidden=false;
  if(v==='detail'){app.innerHTML=viewDetail(l);$('#ctaIn').innerHTML=ctaHTML(l);cta.hidden=false;tabs.hidden=true;window.scrollTo(0,0)}
  else if(v==='saved'){app.innerHTML=viewSaved();window.scrollTo(0,0)}
  else if(v==='post'){app.innerHTML=viewPost();window.scrollTo(0,0);bindForm()}
  else if(v==='me'){app.innerHTML=viewMe();window.scrollTo(0,0)}
  else{app.innerHTML=viewHome();renderList();window.scrollTo(0,homeY)}
  setTab(v==='detail'?'home':v);
  syncSheet();
}

/* ---------- filter sheet ---------- */
var PRESETS=[[0,10000,'১০ হাজার পর্যন্ত'],[10000,20000,'১০–২০ হাজার'],[20000,40000,'২০–৪০ হাজার'],[40000,0,'৪০ হাজারের বেশি']];
function buildSheet(){
  $('#fPresets').innerHTML=PRESETS.map(function(p,i){return '<button class="chip" data-a="preset" data-i="'+i+'">'+p[2]+'</button>'}).join('');
  $('#fBeds').innerHTML=[[0,'যেকোনো'],[1,'১'],[2,'২'],[3,'৩'],[4,'৪ বা বেশি']].map(function(b){return '<button class="chip" data-a="beds" data-v="'+b[0]+'">'+b[1]+'</button>'}).join('');
  $('#fAm').innerHTML=Object.keys(AM).map(function(k){return '<button class="chip" data-a="am" data-v="'+k+'">'+AM[k]+'</button>'}).join('');
  $('#fVer').innerHTML='<button class="chip" data-a="ver">শুধু যাচাইকৃত</button>';
}
function syncSheet(){
  $$('#fPresets .chip').forEach(function(c){var p=PRESETS[+c.dataset.i];c.setAttribute('aria-pressed',String(F.min===p[0]&&F.max===p[1]))});
  $$('#fBeds .chip').forEach(function(c){c.setAttribute('aria-pressed',String(F.beds===+c.dataset.v))});
  $$('#fAm .chip').forEach(function(c){c.setAttribute('aria-pressed',String(F.am.indexOf(c.dataset.v)>=0))});
  $$('#fVer .chip').forEach(function(c){c.setAttribute('aria-pressed',String(F.ver))});
  var mi=$('#fMin'),ma=$('#fMax');if(document.activeElement!==mi)mi.value=F.min?bn(F.min):'';if(document.activeElement!==ma)ma.value=F.max?bn(F.max):'';
  $('#sheetShow').textContent=bn(filtered().length)+'টি বাসা দেখান';
}
var sheetPushed=false;
function hideSheets(){$('#sheet').hidden=true;$('#rsheet').hidden=true}
function openSheet(sel){$(sel).hidden=false;if(!sheetPushed){try{history.pushState({bb:1},'');sheetPushed=true}catch(e){}}}
function closeSheets(){hideSheets();if(sheetPushed){sheetPushed=false;try{history.back()}catch(e){}}}

/* ---------- form ---------- */
function bindForm(){
  var d=new Date();d.setDate(d.getDate()+7);
  var av=$('#pAv');if(av)av.value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
var MONTHS=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
function dateBn(v){var p=String(v||'').split('-');if(p.length!==3)return 'আজ থেকেই';return bn(parseInt(p[2],10))+' '+MONTHS[parseInt(p[1],10)-1]}
function setErr(id,fid,msg){var e=$('#'+id),f=$('#'+fid);e.textContent=msg||'';if(f){if(msg)f.setAttribute('aria-invalid','true');else f.removeAttribute('aria-invalid')}return !msg}
function submitForm(ev){
  ev.preventDefault();
  var area=$('#pA').value.trim(),rent=num($('#pR').value),name=$('#pN').value.trim(),ph=unbn($('#pP').value).replace(/[\s\-]/g,'');
  var okA=setErr('eA','pA',area?'':'এলাকার নাম লিখুন');
  var okR=setErr('eR','pR',rent>=500?'':'ভাড়ার পরিমাণ লিখুন');
  var okN=setErr('eN','pN',name?'':'নাম লিখুন');
  var m=/^(?:\+?88)?(01[3-9]\d{8})$/.exec(ph);
  var okP=setErr('eP','pP',m?'':'সঠিক মোবাইল নম্বর দিন, যেমন ০১৭১২৩৪৫৬৭৮');
  if(!(okA&&okR&&okN&&okP)){var first=$('[aria-invalid="true"]');if(first)first.focus();return}
  var t=$('#pT').value,fl=num($('#pF').value),bd=+$('#pBd').value;
  var l={id:'u'+Date.now(),u:1,t:t,c:$('#pC').value,a:area,
    ti:$('#pTi').value.trim()||(area+'-এ '+T[t]+' ভাড়া'),r:rent,adv:+$('#pAdv').value,sc:num($('#pSc').value),
    bd:bd,ba:+$('#pBa').value,bl:0,fl:fl,bf:Math.min(9,Math.max(fl+1,3)),sq:num($('#pSq').value),av:dateBn($('#pAv').value),
    tn:$('#pTn').value,am:$$('input[name="am"]:checked').map(function(x){return x.value}),v:0,d:0,o:name,ph:m[1],desc:$('#pD').value.trim()};
  ads.unshift(l);store.set('bb_ads',ads);
  toast('বিজ্ঞাপন সংরক্ষিত হয়েছে');
  location.hash='me';
}

/* ---------- helpers ---------- */
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2600)}
function copyText(t){
  return new Promise(function(res){
    try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(function(){res(true)},function(){res(fallback())});return}}catch(e){}
    res(fallback());
  });
  function fallback(){try{var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;opacity:0';document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');ta.remove();return ok}catch(e){return false}}
}
function applyTheme(m){var r=document.documentElement;if(m==='light'||m==='dark')r.setAttribute('data-theme',m);else r.removeAttribute('data-theme');
  var dark=m==='dark'||(m!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  var b=$('#themeBtn');if(b)b.innerHTML='<svg class="ic" aria-hidden="true"><use href="#i-'+(dark?'sun':'moon')+'"/></svg>'}
function shareText(l){return 'বাসা ভাড়া ডটকম: '+l.ti+', '+l.a+', '+l.c+'। ভাড়া '+money(l.r)+' প্রতি মাসে।'}
function refreshFavUI(id){
  $$('.heart[data-id="'+id+'"],.heart-d[data-id="'+id+'"]').forEach(function(b){var on=favs.has(String(id));b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',on?'সংরক্ষণ থেকে সরান':'সংরক্ষণ করুন');if(b.classList.contains('heart-d')){b.style.color=on?'var(--sign)':'inherit';var s=b.querySelector('.ic');if(s)s.classList.toggle('on',on)}});
  setTab(document.body.dataset.v==='detail'?'home':document.body.dataset.v);
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a,id=el.dataset.id;
  if(a==='fav'){e.preventDefault();var k=String(id);if(favs.has(k)){favs.delete(k);toast('সংরক্ষণ থেকে সরানো হয়েছে')}else{favs.add(k);toast('বাসাটি সংরক্ষিত হয়েছে')}
    store.set('bb_fav',Array.from(favs));
    if(document.body.dataset.v==='saved'){route()}else refreshFavUI(k)}
  else if(a==='type'){F.type=el.dataset.v;$$('#typeChips .chip').forEach(function(c){c.setAttribute('aria-pressed',String(c.dataset.v===F.type))});renderList()}
  else if(a==='sheet-open'){openSheet('#sheet');syncSheet()}
  else if(a==='sheet-close'){closeSheets()}
  else if(a==='preset'){var p=PRESETS[+el.dataset.i];if(F.min===p[0]&&F.max===p[1]){F.min=0;F.max=0}else{F.min=p[0];F.max=p[1]}syncSheet();renderList()}
  else if(a==='beds'){F.beds=+el.dataset.v;syncSheet();renderList()}
  else if(a==='am'){var v=el.dataset.v,i=F.am.indexOf(v);if(i>=0)F.am.splice(i,1);else F.am.push(v);syncSheet();renderList()}
  else if(a==='ver'){F.ver=!F.ver;syncSheet();renderList()}
  else if(a==='filter-reset'){F.min=0;F.max=0;F.beds=0;F.ver=false;F.am=[];syncSheet();renderList()}
  else if(a==='filter-reset-all'){F.q='';F.type='';F.city='';F.min=0;F.max=0;F.beds=0;F.ver=false;F.am=[];route()}
  else if(a==='back'){if(navs>0){e.preventDefault();history.back()}}
  else if(a==='demo-contact'){toast('এটি ডেমো বিজ্ঞাপন। আসল অ্যাপে এখানে সরাসরি যোগাযোগ হবে।')}
  else if(a==='copy'){copyText(el.dataset.ph).then(function(ok){toast(ok?'নম্বর কপি হয়েছে':'কপি করা যায়নি, নম্বরটি চেপে ধরে কপি করুন')})}
  else if(a==='share'){var l=find(id);if(!l)return;var tx=shareText(l);
    if(window.AndroidBridge&&AndroidBridge.share){AndroidBridge.share(tx)}else copyText(tx).then(function(ok){toast(ok?'বিজ্ঞাপনের তথ্য কপি হয়েছে':'কপি করা যায়নি')})}
  else if(a==='report-open'){reportId=id;openSheet('#rsheet')}
  else if(a==='report-send'){closeSheets();toast('রিপোর্ট নেওয়া হয়েছে। আসল অ্যাপে আমাদের টিম ২৪ ঘণ্টার মধ্যে দেখবে।')}
  else if(a==='theme-cycle'){var cur=store.get('bb_theme','system'),dark=document.documentElement.getAttribute('data-theme')==='dark'||(cur==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);var nx=dark?'light':'dark';store.set('bb_theme',nx);applyTheme(nx);if(document.body.dataset.v==='me')route()}
  else if(a==='theme-set'){store.set('bb_theme',el.dataset.v);applyTheme(el.dataset.v);route()}
  else if(a==='rent-toggle'){ads.forEach(function(x){if(String(x.id)===String(id))x.rented=!x.rented});store.set('bb_ads',ads);route()}
  else if(a==='ad-del'){if(delArm===String(id)){ads=ads.filter(function(x){return String(x.id)!==String(id)});favs.delete(String(id));store.set('bb_ads',ads);store.set('bb_fav',Array.from(favs));delArm=null;toast('বিজ্ঞাপন মুছে ফেলা হয়েছে')}else delArm=String(id);route()}
  else if(a==='reset-demo'){if(delArm==='reset'){ads=[];favs=new Set();store.set('bb_ads',[]);store.set('bb_fav',[]);delArm=null;toast('সব মুছে ফেলা হয়েছে')}else delArm='reset';route()}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){F.q=t.value;renderList()}
  else if(t.id==='fMin'||t.id==='fMax'){F[t.id==='fMin'?'min':'max']=num(t.value);syncSheet();renderList()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='city'){F.city=t.value;renderList()}
  else if(t.id==='sort'){F.sort=t.value;renderList()}
});
document.addEventListener('submit',function(e){if(e.target.id==='postForm')submitForm(e)});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheets()});
window.addEventListener('hashchange',function(){navs++;delArm=null;route()});
window.addEventListener('popstate',function(){if(sheetPushed){sheetPushed=false;hideSheets()}});
if(window.matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){applyTheme(store.get('bb_theme','system'))})}catch(e){}

buildSheet();
applyTheme(store.get('bb_theme','system'));
route();
})();
</script>

</html>
